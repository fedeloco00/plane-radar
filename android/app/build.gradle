apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'eu.vinyes.planeradar'
    compileSdk 34

    defaultConfig {
        applicationId "eu.vinyes.planeradar"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            // Debug-signed with the default Android debug key - fine for
            // personal sideloading, not for Play Store distribution.
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    // Minimal embedded HTTP server so the app can also serve the radar to
    // other devices on the same WiFi network (see LanWebServer.kt).
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
